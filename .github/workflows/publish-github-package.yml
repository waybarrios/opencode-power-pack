name: Publish GitHub Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish, for example v0.5.0
        required: true
        default: v0.5.0

concurrency:
  group: github-package-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@waybarrios"
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expected = `v${version}`;
            if (process.env.RELEASE_REF !== expected) {
              console.error(`Release ref ${process.env.RELEASE_REF} does not match package version ${expected}`);
              process.exit(1);
            }
          '
      - name: Publish release to GitHub Packages
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
