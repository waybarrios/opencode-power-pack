name: Claude Code smoke

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/claude-smoke.yml"
  workflow_dispatch:

jobs:
  claude-2-1-231:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.231 plugin validate . --strict
