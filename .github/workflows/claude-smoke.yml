name: Claude Code smoke

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/claude-smoke.yml"
  workflow_dispatch:

jobs:
  claude-2-1-231:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.231 plugin validate . --strict
