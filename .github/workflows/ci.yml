name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: node --test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Agent Skills specification
        run: |
          python -m pip install skills-ref==0.1.1
          for skill in skills/*; do
            agentskills validate "$skill"
          done
